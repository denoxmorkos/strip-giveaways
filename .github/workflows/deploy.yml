name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/01a0922a-strip-giveaways
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          set -euo pipefail
          for f in index.html styles.css script.js robots.txt sitemap.xml 404.html .nojekyll; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
          echo "All required files present."

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Validate JSON-LD blocks
        run: |
          python3 - <<'EOF'
          import re, json, sys
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          assert blocks, "No JSON-LD blocks found"
          for b in blocks:
              json.loads(b)
          print(f"JSON-LD OK ({len(blocks)} block(s))")
          EOF

      - name: Validate sitemap XML
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml'); print('sitemap.xml OK')"

      - name: Check images have alt text and dimensions
        run: |
          python3 - <<'EOF'
          import re, sys
          html = open('index.html', encoding='utf-8').read()
          imgs = re.findall(r'<img\b[^>]*>', html)
          assert imgs, "No images found"
          for tag in imgs:
              assert 'alt=' in tag, f"Missing alt: {tag}"
              assert 'width=' in tag and 'height=' in tag, f"Missing dimensions: {tag}"
              assert 'loading="lazy"' in tag, f"Missing lazy loading: {tag}"
          print(f"Images OK ({len(imgs)} checked)")
          EOF

      - name: Check promo links use safe attributes
        run: |
          python3 - <<'EOF'
          import re
          html = open('index.html', encoding='utf-8').read()
          for m in re.finditer(r'<a\b[^>]*href="https://(stripfreetokens\.com|striptokens\.live|striptks\.live)[^"]*"[^>]*>', html):
              tag = m.group(0)
              assert 'rel="nofollow sponsored noopener noreferrer"' in tag, f"Bad rel: {tag}"
              assert 'target="_blank"' in tag, f"Missing target: {tag}"
          print("Promo link attributes OK")
          EOF

      - name: Scan for committed secrets (basic)
        run: |
          set -euo pipefail
          ! grep -RInE "(ghp_|gho_|github_pat_|BEGIN .*(PRIVATE|RSA) KEY|sk-live|api[_-]?key\s*=\s*['\"][^'\"]+)" \
            --exclude-dir=.git --exclude-dir=.github --exclude="*.png" . || { echo "Possible secret detected"; exit 1; }
          echo "No obvious secrets found."

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
