<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-hidden="true">
  <title>Scam warning illustration</title>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181C25"/>
      <stop offset="1" stop-color="#10131B"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="orb3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#bg3)"/>
  <circle cx="400" cy="280" r="230" fill="url(#orb3)"/>
  <!-- shield -->
  <g>
    <path d="M400 110 L560 170 V310 C560 420 490 480 400 520 C310 480 240 420 240 310 V170 Z" fill="url(#shield)" stroke="#FDE68A" stroke-width="6"/>
    <path d="M400 150 L524 192 V308 C524 396 466 446 400 480 C334 446 276 396 276 308 V192 Z" fill="#0F1117" opacity="0.85"/>
    <rect x="384" y="230" width="32" height="110" rx="16" fill="#FBBF24"/>
    <circle cx="400" cy="378" r="18" fill="#FBBF24"/>
  </g>
  <!-- crossed scam icons -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <g>
      <rect x="120" y="420" width="230" height="120" rx="16" fill="#232936" stroke="#F87171" stroke-width="3"/>
      <text x="235" y="472" font-size="30" fill="#FCA5A5" text-anchor="middle">✕ generator</text>
      <text x="235" y="508" font-size="20" fill="#9AA3B2" text-anchor="middle">unlimited tokens?</text>
    </g>
    <g>
      <rect x="450" y="420" width="230" height="120" rx="16" fill="#232936" stroke="#F87171" stroke-width="3"/>
      <text x="565" y="472" font-size="30" fill="#FCA5A5" text-anchor="middle">✕ .apk download</text>
      <text x="565" y="508" font-size="20" fill="#9AA3B2" text-anchor="middle">never install</text>
    </g>
  </g>
</svg>
