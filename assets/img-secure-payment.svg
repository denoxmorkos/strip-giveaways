<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-hidden="true">
  <title>Secure digital payment illustration</title>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181C25"/>
      <stop offset="1" stop-color="#10131B"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cyan1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E879F9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#bg1)"/>
  <circle cx="640" cy="120" r="180" fill="url(#orb1)"/>
  <circle cx="120" cy="500" r="140" fill="#22D3EE" opacity="0.08"/>
  <!-- payment card -->
  <g transform="rotate(-8 400 300)">
    <rect x="200" y="200" width="400" height="230" rx="24" fill="url(#card1)"/>
    <rect x="200" y="200" width="400" height="230" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="240" y="250" width="64" height="48" rx="8" fill="#FBBF24" opacity="0.9"/>
    <rect x="240" y="270" width="64" height="6" fill="#92400E" opacity="0.5"/>
    <rect x="262" y="250" width="6" height="48" fill="#92400E" opacity="0.5"/>
    <circle cx="520" cy="272" r="26" fill="#22D3EE" opacity="0.85"/>
    <circle cx="552" cy="272" r="26" fill="#F472B6" opacity="0.7"/>
    <rect x="240" y="330" width="220" height="16" rx="8" fill="#FFFFFF" opacity="0.75"/>
    <rect x="240" y="360" width="140" height="12" rx="6" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <!-- lock badge -->
  <g>
    <circle cx="588" cy="418" r="66" fill="#0F1117" stroke="#22D3EE" stroke-width="4"/>
    <rect x="564" y="414" width="48" height="38" rx="8" fill="url(#cyan1)"/>
    <path d="M572 414 v-12 a16 16 0 0 1 32 0 v12" fill="none" stroke="#E0F2FE" stroke-width="6"/>
    <circle cx="588" cy="432" r="5" fill="#0F1117"/>
  </g>
  <!-- check chips -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <rect x="120" y="120" width="210" height="52" rx="26" fill="#14532D" stroke="#34D399" stroke-width="2"/>
    <text x="222" y="153" font-size="22" fill="#D1FAE5" text-anchor="middle">✓ Secure checkout</text>
    <rect x="470" y="486" width="210" height="52" rx="26" fill="#14532D" stroke="#34D399" stroke-width="2"/>
    <text x="575" y="519" font-size="22" fill="#D1FAE5" text-anchor="middle">✓ Verified domain</text>
  </g>
</svg>
